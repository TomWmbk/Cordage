name: Deploy Cordage

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/Cordage

            git pull --ff-only

            docker compose -f docker-compose.prod.yml up -d --build

            docker image prune -f

            container=$(docker compose -f docker-compose.prod.yml ps -q app)
            for i in $(seq 1 45); do
              status=$(docker inspect -f '{{.State.Health.Status}}' "$container")
              [ "$status" != starting ] && break
              sleep 2
            done

            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml logs app --tail 40
            docker compose -f docker-compose.prod.yml exec -T app npx prisma migrate status

            [ "$status" = healthy ]
