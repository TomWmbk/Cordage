services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: file:/app/data/cordage.db
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET doit etre defini}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?NEXTAUTH_URL doit etre defini}
    volumes:
      - cordage-data:/app/data
    restart: unless-stopped

volumes:
  cordage-data:
